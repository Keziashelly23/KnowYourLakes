<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Know Your Lakes</title>
  <link rel="stylesheet" href="rip-alerts.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow"> Check current lake safety before you go </p>
      <h1>Rip Current Status</h1>
      <p class="intro">
        Pick a lake to see water movement, swim safety, and a quick shoreline note.
      </p>
    </section>

    <section class="lake-card">
      <label for="lake-select" class="field-label">Choose a Michigan lake</label>
      <select id="lake-select" class="lake-select" aria-label="Choose a Michigan lake">
        <option value="">Select a lake</option>
      </select>
      <p id="data-status" class="data-status">Loading lake data...</p>

      <article id="lake-report" class="lake-report hidden" aria-live="polite">
        <div class="report-header">
          <div>
            <p id="lake-region" class="region"></p>
            <h2 id="lake-name"></h2>
            <p id="lake-updated" class="updated"></p>
          </div>
          <span id="lake-badge" class="badge"></span>
        </div>

        <div class="stats">
          <div class="stat">
            <p class="stat-label">Current</p>
            <p id="lake-current" class="stat-value"></p>
          </div>
          <div class="stat">
            <p class="stat-label">Swim Safety</p>
            <p id="lake-safety" class="stat-value"></p>
          </div>
          <div class="stat">
            <p class="stat-label">Wave Action</p>
            <p id="lake-waves" class="stat-value"></p>
          </div>
        </div>

        <div class="details">
          <p>
            <strong>Beach note:</strong>
            <span id="lake-note"></span>
          </p>
          <p>
            <strong>Advice:</strong>
            <span id="lake-advice"></span>
          </p>
        </div>
      </article>
    </section>
  </main>

  <script src="rip-alerts.js"></script>
</body>
</html>
