<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KYL Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f7fa;
    }

    .topbar {
      width: 100%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* NEW IMAGE STYLE */
    .logo-img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-text h1 {
      font-size: 18px;
      color: #1d2b3a;
      font-weight: bold;
    }

    .logo-text p {
      font-size: 13px;
      color: #6c7a89;
      margin-top: 2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-item {
      text-decoration: none;
      color: #4c5667;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-item:hover {
      color: #1e63ff;
    }

    .logout {
      text-decoration: none;
      color: #4c5667;
      font-size: 16px;
      font-weight: 600;
    }

    .logout:hover {
      color: #d62828;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="logo-section">
    
    <!-- RANDOM IMAGE -->
    <img src="https://KYLFAVICON.png" alt="Logo" class="logo-img">

    <div class="logo-text">
      <h1>KYL Dashboard</h1>
      <p>Know Your Lakes</p>
    </div>
  </div>

  <nav class="nav-links">
    <a href="rip-alerts.html" class="nav-item"> Rip Current Alerts</a>
    <a href="bacteria.html" class="nav-item"> Bacteria Warnings</a>
    <a href="beaches.html" class="nav-item"> Accessible Beaches</a>
    <a href="crowd.html" class="nav-item"> Crowd Meter</a>
  </nav>

  <a href="logout.html" class="logout"> Logout</a>
</header>

</body>
</html>
