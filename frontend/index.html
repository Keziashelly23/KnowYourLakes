<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #e6e6e6;
        height: 100vh;
        position: relative;
    }

    /* Login button (top-right) */
    .login-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 12px 25px;
        background-color: #888;
        color: black;
        border: none;
        cursor: pointer;
        font-size: 14px;
    }

    .login-btn:hover {
        background-color: #ff7d7d;
    }

    /* Centered welcome text */
    .center-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        color: #222;
    }
</style>
</head>
<body>

<button id="googleLogin" class="login-btn">LOGIN</button>

<div class="center-text">
    Welcome to Know Your Lakes!
</div>

<script src="script.js"></script>
</body>
</html>
