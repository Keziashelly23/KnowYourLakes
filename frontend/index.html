<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Know Your Lakes</title>
<link rel="icon" href="KYLFAVICON.png" type="image/png">
<style>
    @font-face{
        font-family: 'BeachFont';
        src: url(Tiki\ Tropic.ttf) format('opentype');
    }



    body {
        margin: 0;
        font-family: 'BeachFont', sans-serif;
        background-color: #e6e6e6;
        height: 100vh;
        position: relative;
        
    }

    /* Login button (top-right) */
    .login-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 12px 25px;
        background-color: #888;
        color: black;
        border: none;
        cursor: pointer;
        font-size: 14px;
    }

    .login-btn:hover {
        background-color: #FDC0BD;
    }

    /* Centered welcome text */
    .center-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 70px;
        color: #222;
        font-family: 'BeachFont', sans-serif;
        letter-spacing: 3px;
        
    }
    
   


</style>
</head>
<body>

<button class="login-btn">LOGIN</button>

<div class="center-text">
    Know Your Lakes
</div>

</body>
</html>
